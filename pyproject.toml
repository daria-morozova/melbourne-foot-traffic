[project]
name = "melbourne-foot-traffic"
version = "0.1.0"
description = "Day-ahead forecasts and post-COVID analysis of Melbourne CBD foot traffic"
readme = "README.md"
authors = [
    { name = "Daria Morozova", email = "limpokaya@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "holidays>=0.105",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
melbourne-foot-traffic = "melbourne_foot_traffic:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
]
